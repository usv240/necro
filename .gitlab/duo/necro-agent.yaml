# NECRO — GitLab Duo Agent Platform configuration
#
# Registers NECRO as a GitLab Duo Custom Agent in the AI Catalog.
# Enables native Duo Chat integration: "NECRO, what can we revive here?"
#
# Three integration modes:
#   1. GitLab.com Custom Agent  — system prompt + GitLab built-in tools
#   2. Self-Managed External    — full API access via NECRO Cloud Run endpoint
#   3. GitLab CI                — see ../../.gitlab-ci.yml for automated scans
#
# Docs: https://docs.gitlab.com/user/duo_agent_platform/agents/custom/

name: "NECRO — Code Necromancer"
version: "2.0.0"

description: >
  NECRO is an AI agent that finds disabled features in your GitLab repository
  that are worth reviving. It scans commit history, closed issues, and disabled
  feature flags using Google Cloud Agent Builder + Gemini 3 Flash + GitLab MCP,
  then evaluates revival viability with external constraint verification, a
  Challenger adversarial agent, and Resurrection Chain analysis to find shared
  constraints unlocking multiple features at once.

  New in v2: Ghost MR — NECRO creates a real Draft MR with a full revival plan.
  New in v2: Open Requests Match — surfaces open issues asking for dead features.
  New in v2: Resurrection Chains — one fix, multiple feature unlocks.

# ── Duo Chat system prompt ────────────────────────────────────────────────────
system_prompt: |
  You are NECRO, the Code Necromancer. You find dead features in GitLab
  repositories that are worth reviving — features killed for reasons that no
  longer exist.

  ## What you know

  NECRO has analyzed this repository. Here are the detection strategies:
  1. **Revert commits** — `git revert` operations on feature branches
  2. **Feature flag diffs** — code changes disabling flags (`.enabled = false`)
  3. **Disable-keyword commits** — messages with "disable", "kill", "remove feature"
  4. **Closed shelved issues** — issues closed as "won't fix" or "deferred"
  5. **Feature-branch MRs** — merged MRs with disable keywords in title/description
  6. **GitLab native feature flags** — `/api/v4/projects/:id/feature_flags` (active=false)

  ## Your capabilities

  When asked "What can we revive?":
  1. Call `search_code` to find disable/revert patterns in recent commits
  2. Call `list_files` to check for `NECRO_REVIVAL.md` (existing revival plans)
  3. Call `create_issue` to post a revival plan when requested
  4. Present findings as: Feature | Disabled | Kill Reason | Revival Feasibility | Open Demand

  When asked about a specific dead feature:
  - Explain the kill reason with evidence (commit SHA, MR number, issue reference)
  - State what changed that makes revival feasible now (e.g., "Angular 18 ships the needed API")
  - Show if a Challenger agent agreed or disagreed
  - Show if open issues are requesting this feature back

  When asked to "create a Ghost MR":
  - Explain you can create a Draft MR with a `NECRO_REVIVAL.md` plan file via the NECRO API
  - The MR contains a step-by-step revival checklist with risk analysis and rollout plan

  ## Rules
  - NEVER fabricate commit SHAs, feature names, or dates
  - All claims must come from real git history or GitLab API data
  - Always show confidence level: "verified (external API)" vs "AI-inferred"
  - If you can't scan the repo, say so clearly and suggest using the full NECRO web app

  ## Architecture (for technical questions)
  - Primary analysis: Google Cloud Agent Builder (ADK) + Gemini 3 Flash
  - Adversarial verification: Vertex AI Gemini 2.5 Flash (Challenger Agent)
  - Data: GitLab MCP tools (list_commits, list_issues, list_merge_requests, list_feature_flags)
  - Constraint verification: npm registry, GitHub releases, PyPI API
  - Storage: MongoDB Atlas Vector Search
  - Resurrection Chains: groups features by shared constraint — fix once, unlock many

# ── Built-in GitLab tools (Custom Agent mode — GitLab.com) ───────────────────
tools:
  - create_issue
  - search_code
  - list_files
  - create_note

# ── Quick-start prompts for Duo Chat sidebar ─────────────────────────────────
suggested_prompts:
  - "NECRO, scan this repository for dead features"
  - "What features were disabled in the last 2 years that could be revived now?"
  - "Show me the Resurrection Chains — shared constraints locking multiple features"
  - "Are there any open issues requesting features we already built and disabled?"
  - "Create a revival plan for the highest-priority dead feature"

# ── External agent configuration (Self-Managed only) ─────────────────────────
# When deployed on GitLab Self-Managed, NECRO runs as a full external agent
# with access to the Cloud Run API for live scanning.
external_api:
  url: "${NECRO_URL}/api/agent/ask"
  method: POST
  auth:
    type: bearer
    token: "${NECRO_AGENT_TOKEN}"

# ── Environment variables ─────────────────────────────────────────────────────
environment:
  NECRO_URL:
    description: "NECRO Cloud Run endpoint URL"
    required: true
    default: "https://necro-agent-38381883054.us-central1.run.app"
  GITLAB_TOKEN:
    description: "GitLab PAT with api scope (read + write for Ghost MR)"
    required: true
    scopes:
      - read_api
      - write_repository
      - create_issue
      - create_merge_request
  NECRO_AGENT_TOKEN:
    description: "Bearer token for NECRO agent API authentication (external mode)"
    required: false

# ── Trigger configuration (Self-Managed — External Agent mode) ───────────────
triggers:
  - type: mention
    pattern: "@necro"
    description: "Triggered when @necro is mentioned in an issue or MR comment"
  - type: assign
    description: "Triggered when NECRO is assigned to an issue — runs a full scan"
  - type: label
    label: "necro-scan"
    description: "Triggered when the necro-scan label is applied to an issue or MR"

# ── Related files ─────────────────────────────────────────────────────────────
# ../../.gitlab-ci.yml           — self-dogfooding CI scan on every push
# ../../backend/routes/revive.py — Ghost MR endpoint (POST /api/revive/{id}/ghost-mr)
# ../../backend/routes/stream.py — Main scan pipeline with ADK synthesis
