##
## NECRO — Feature Will Generator (GitLab Duo Custom Flow)
##
## What this does:
##   When a Merge Request is opened that kills a feature, this flow fires.
##   NECRO's ADK agent (Google Cloud Agent Builder + Gemini 3 Flash) analyzes
##   the MR diff and creates a "Revival Contract" GitLab issue — preserving
##   institutional knowledge at 100% fidelity at the exact moment of death.
##
## Information Decay Curve (why this matters):
##   Moment of kill  →  100% fidelity (exact constraint, engineer, context)
##   6 months later  →   40% (engineer moved on, context faded)
##   18 months later →    5% (archaeological guesswork)
##   This flow captures at 100%. All other approaches capture at 5–40%.
##
## Setup:
##   1. Deploy NECRO backend (Railway / Render / Cloud Run)
##   2. Set NECRO_WEBHOOK_URL in your GitLab project CI/CD variables
##   3. Enable "Allow flow execution" in Settings → GitLab Duo (already on ✅)
##
## This is STRUCTURAL enforcement — not advisory AI.
## Advisory AI: "You should document this." → ignored 80% of the time.
## This flow: automatically creates the Revival Contract. Always.
##

name: necro-feature-will-generator

on:
  merge_request:
    events:
      - opened
      - reopened

description: >
  NECRO Feature Will Generator — preserves institutional knowledge at the
  moment a feature is killed. Creates a Revival Contract issue via
  Google Cloud Agent Builder + GitLab MCP.

steps:
  - name: trigger-necro-will-generation
    action: http_request
    inputs:
      url: $NECRO_WEBHOOK_URL
      method: POST
      headers:
        Content-Type: application/json
        X-Gitlab-Token: $NECRO_WEBHOOK_SECRET
      body: |
        {
          "object_kind": "merge_request",
          "project": {
            "path_with_namespace": "$CI_PROJECT_PATH"
          },
          "object_attributes": {
            "iid": $CI_MERGE_REQUEST_IID,
            "title": "$CI_MERGE_REQUEST_TITLE",
            "description": "$CI_MERGE_REQUEST_DESCRIPTION",
            "action": "open"
          },
          "user": {
            "name": "$GITLAB_USER_NAME",
            "username": "$GITLAB_USER_LOGIN"
          }
        }

  - name: add-revival-note
    action: create_note
    inputs:
      noteable_type: MergeRequest
      noteable_id: $CI_MERGE_REQUEST_IID
      body: |
        🪦 **NECRO — Feature Will Generator triggered**

        This MR was analyzed by NECRO's ADK agent (Google Cloud Agent Builder + Gemini 3 Flash).
        If a feature kill was detected, a **Revival Contract** issue has been created automatically
        with: kill reason, revival conditions, effort estimate, and engineer attribution.

        > *Institutional knowledge captured at 100% fidelity — before any decay.*
        >
        > Powered by Google Cloud Agent Builder + GitLab MCP + MongoDB Atlas
