# NECRO — GitLab CI/CD Pipeline
#
# Stages:
#   test     → pytest (no external credentials needed)
#   security → GitLab SAST + Secret Detection (built-in, free tier)
#   scan     → NECRO dogfoods itself against its own repo (requires NECRO_URL)
#   deploy   → Cloud Run deploy (requires GCP variables, manual trigger)
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   NECRO_URL          — live Cloud Run / Render URL for self-scan
#   GOOGLE_PROJECT_ID  — for deploy stage (optional)
#   CLOUD_RUN_SERVICE  — Cloud Run service name (optional)
#   CLOUD_RUN_REGION   — e.g. us-central1 (optional)
#   GEMINI_API_KEY     — for live scan (optional, scan skips gracefully without it)

# ── GitLab built-in security templates ───────────────────────────────────────
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# ── Global variables ──────────────────────────────────────────────────────────
variables:
  NECRO_MAX_COMMITS: "50"
  NECRO_LOOKBACK_MONTHS: "24"

# ── Pipeline stages ───────────────────────────────────────────────────────────
stages:
  - test
  - security
  - scan
  - deploy

# ─────────────────────────────────────────────────────────────────────────────
# 1. TEST — pytest (runs on every push, no credentials needed)
# ─────────────────────────────────────────────────────────────────────────────
run-tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - pytest tests/test_necro.py -q --tb=short
  artifacts:
    reports:
      junit: test-results.xml
    when: always
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH'

# ─────────────────────────────────────────────────────────────────────────────
# 2. SECURITY — GitLab built-in SAST + Secret Detection
#    Runs on every MR and default branch push.
#    Results appear in the Security Dashboard and MR widget.
# ─────────────────────────────────────────────────────────────────────────────
sast:
  stage: security

secret_detection:
  stage: security

# ─────────────────────────────────────────────────────────────────────────────
# 3. SELF-SCAN — NECRO dogfoods itself
#    Scans the NECRO repo for its own dormant features.
#    Skips gracefully if NECRO_URL is not configured.
# ─────────────────────────────────────────────────────────────────────────────
necro-self-scan:
  stage: scan
  image: curlimages/curl:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NECRO_URL'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NECRO_URL'
  script:
    - |
      echo "=== NECRO — Dormant Code Recovery ==="
      echo "Scanning: ${CI_PROJECT_PATH}"
      echo "Agent: Google Cloud Agent Builder + Gemini 3 Flash + GitLab MCP"
      echo ""

      RESPONSE=$(curl -sf -X POST "${NECRO_URL}/api/scan/quick" \
        -H "Content-Type: application/json" \
        -d "{
          \"repo_url\": \"https://gitlab.com/${CI_PROJECT_PATH}\",
          \"max_commits\": ${NECRO_MAX_COMMITS},
          \"lookback_months\": ${NECRO_LOOKBACK_MONTHS}
        }" \
        --max-time 180) || { echo "NECRO scan skipped (service not reachable)"; exit 0; }

      echo "$RESPONSE" | head -c 3000
      echo ""
      echo "Scan complete. Saving report..."
      echo "$RESPONSE" > necro-report.json

  artifacts:
    paths:
      - necro-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ─────────────────────────────────────────────────────────────────────────────
# 4. POST REPORT — create a native GitLab issue with graveyard findings
# ─────────────────────────────────────────────────────────────────────────────
necro-post-report:
  stage: scan
  image: curlimages/curl:latest
  needs: ["necro-self-scan"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NECRO_URL'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NECRO_URL'
      when: on_success
  script:
    - |
      if [ ! -f necro-report.json ]; then
        echo "No report — skipping issue creation"
        exit 0
      fi

      curl -sf -X POST "${NECRO_URL}/api/report/post-to-gitlab" \
        -H "Content-Type: application/json" \
        -d @necro-report.json \
        --max-time 30 || echo "Post to GitLab skipped"

      echo "Done — check ${CI_PROJECT_URL}/-/issues for the Graveyard Report"
  allow_failure: true

# ─────────────────────────────────────────────────────────────────────────────
# 5. DEPLOY — Cloud Run (manual trigger, requires GCP variables)
# ─────────────────────────────────────────────────────────────────────────────
deploy-cloud-run:
  stage: deploy
  image: google/cloud-sdk:slim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GOOGLE_PROJECT_ID'
      when: manual
  script:
    - |
      gcloud run deploy ${CLOUD_RUN_SERVICE:-necro-agent} \
        --source . \
        --region ${CLOUD_RUN_REGION:-us-central1} \
        --project ${GOOGLE_PROJECT_ID} \
        --allow-unauthenticated \
        --memory 1Gi \
        --timeout 300 \
        --set-env-vars "MONGODB_URI=${MONGODB_URI},GITLAB_TOKEN=${GITLAB_TOKEN},GEMINI_API_KEY=${GEMINI_API_KEY},GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}" \
        --quiet
    - echo "Deployed to Cloud Run — ${CLOUD_RUN_SERVICE:-necro-agent}"
  environment:
    name: production
    url: $NECRO_URL
  allow_failure: false
