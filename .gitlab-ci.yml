# NECRO — GitLab CI/CD Pipeline
#
# Full pipeline mirroring the GitLab + Gemini best-practice workflow:
#   build → test → security → upload (Artifact Registry) → deploy (Cloud Run) → necro-scan
#
# Google Cloud authentication uses Workload Identity Federation (no service account keys).
# Set these CI/CD variables in GitLab → Settings → CI/CD → Variables:
#   GOOGLE_PROJECT_ID       — GCP project ID
#   GOOGLE_ARTIFACT_REGION  — e.g. us-central1
#   GOOGLE_ARTIFACT_REPO    — Artifact Registry repo name, e.g. necro
#   CLOUD_RUN_SERVICE       — Cloud Run service name, e.g. necro-agent
#   CLOUD_RUN_REGION        — e.g. us-central1
#   NECRO_URL               — Live Cloud Run URL (for self-scan stage)
#   NECRO_MAX_COMMITS       — (optional) default 50
#   NECRO_LOOKBACK_MONTHS   — (optional) default 24

variables:
  NECRO_URL: "https://necro-agent-38381883054.us-central1.run.app"
  NECRO_MAX_COMMITS: "50"
  NECRO_LOOKBACK_MONTHS: "24"
  DOCKER_DRIVER: overlay2
  # Image path in Google Artifact Registry
  AR_IMAGE: "${GOOGLE_ARTIFACT_REGION}-docker.pkg.dev/${GOOGLE_PROJECT_ID}/${GOOGLE_ARTIFACT_REPO}/necro-agent"

stages:
  - build
  - test
  - security
  - upload
  - deploy
  - necro-scan
  - necro-report

# ── 1. BUILD — Docker image ───────────────────────────────────────────────────
build-image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    # Tag as latest on default branch
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'

# ── 2. TEST — pytest ──────────────────────────────────────────────────────────
run-tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - pytest tests/test_necro.py -q --ignore-glob='*live*' --tb=short
  artifacts:
    reports:
      junit: test-results.xml
    when: always
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH'

# ── 3. SECURITY — GitLab built-in scanners ───────────────────────────────────
# SAST: static analysis for Python code vulnerabilities
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

# Override stage placement so security runs after test
sast:
  stage: security

secret_detection:
  stage: security

dependency_scanning:
  stage: security

# ── 4. UPLOAD — push to Google Artifact Registry ─────────────────────────────
upload-to-ar:
  stage: upload
  image: google/cloud-sdk:slim
  # Uses Workload Identity Federation — no service account key needed.
  # GitLab Settings → Integrations → Google Cloud IAM must be active.
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "https://iam.googleapis.com/projects/${GOOGLE_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GITLAB_POOL_ID}/providers/${GITLAB_PROVIDER_ID}"
  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/oidc_token.txt
    - |
      gcloud iam workload-identity-pools create-cred-config \
        "projects/${GOOGLE_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GITLAB_POOL_ID}/providers/${GITLAB_PROVIDER_ID}" \
        --service-account="${GOOGLE_SERVICE_ACCOUNT}" \
        --output-file=/tmp/creds.json \
        --credential-source-file=/tmp/oidc_token.txt
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/creds.json
    - gcloud auth login --cred-file=/tmp/creds.json --quiet
    - gcloud auth configure-docker ${GOOGLE_ARTIFACT_REGION}-docker.pkg.dev --quiet
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA ${AR_IMAGE}:$CI_COMMIT_SHORT_SHA
    - docker push ${AR_IMAGE}:$CI_COMMIT_SHORT_SHA
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag ${AR_IMAGE}:$CI_COMMIT_SHORT_SHA ${AR_IMAGE}:latest
        docker push ${AR_IMAGE}:latest
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs: ["build-image"]

# ── 5. DEPLOY — Cloud Run (main branch merges only) ──────────────────────────
deploy-to-cloud-run:
  stage: deploy
  image: google/cloud-sdk:slim
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "https://iam.googleapis.com/projects/${GOOGLE_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GITLAB_POOL_ID}/providers/${GITLAB_PROVIDER_ID}"
  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/oidc_token.txt
    - |
      gcloud iam workload-identity-pools create-cred-config \
        "projects/${GOOGLE_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GITLAB_POOL_ID}/providers/${GITLAB_PROVIDER_ID}" \
        --service-account="${GOOGLE_SERVICE_ACCOUNT}" \
        --output-file=/tmp/creds.json \
        --credential-source-file=/tmp/oidc_token.txt
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/creds.json
    - gcloud auth login --cred-file=/tmp/creds.json --quiet
    - |
      gcloud run deploy ${CLOUD_RUN_SERVICE} \
        --image=${AR_IMAGE}:$CI_COMMIT_SHORT_SHA \
        --region=${CLOUD_RUN_REGION} \
        --project=${GOOGLE_PROJECT_ID} \
        --allow-unauthenticated \
        --quiet
    - echo "Deployed ${AR_IMAGE}:${CI_COMMIT_SHORT_SHA} to Cloud Run service '${CLOUD_RUN_SERVICE}'"
  environment:
    name: production
    url: $NECRO_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs: ["upload-to-ar"]

# ── 6. SELF-SCAN — NECRO dogfoods itself ─────────────────────────────────────
necro-self-scan:
  stage: necro-scan
  image: curlimages/curl:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      echo "=== NECRO Code Necromancer — scanning ${CI_PROJECT_PATH} ==="
      echo "Powered by Google Cloud Agent Builder + GitLab Duo + GitLab MCP"
      echo ""

      RESPONSE=$(curl -s -X POST "${NECRO_URL}/api/scan/quick" \
        -H "Content-Type: application/json" \
        -d "{
          \"repo_url\": \"${CI_PROJECT_PATH}\",
          \"max_commits\": ${NECRO_MAX_COMMITS},
          \"lookback_months\": ${NECRO_LOOKBACK_MONTHS}
        }" \
        --max-time 120)

      echo "$RESPONSE" | head -c 2000
      echo ""
      echo "Scan complete — check MR/Issues for the Graveyard Report"

  artifacts:
    reports:
      dotenv: necro-scan.env
    paths:
      - necro-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ── 7. POST REPORT — GitLab issue with graveyard findings ────────────────────
necro-post-report:
  stage: necro-report
  image: curlimages/curl:latest
  needs: ["necro-self-scan"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
  script:
    - |
      if [ ! -f necro-report.json ]; then
        echo "No report file — skipping issue creation"
        exit 0
      fi

      curl -s -X POST "${NECRO_URL}/api/report/post-to-gitlab" \
        -H "Content-Type: application/json" \
        -d @necro-report.json \
        --max-time 30 || true

      echo "Graveyard report posted to ${CI_PROJECT_URL}/-/issues"
  allow_failure: true
